<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Sunrise over the Texas Capitol — a new day for survivors">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191428"/>
      <stop offset="0.55" stop-color="#3B2A5A"/>
      <stop offset="0.85" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5F0E8"/>
      <stop offset="0.6" stop-color="#F5F0E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5F0E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100D1C"/>
      <stop offset="1" stop-color="#191428"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#sky)"/>
  <circle cx="450" cy="470" r="240" fill="url(#sun)"/>
  <circle cx="450" cy="470" r="86" fill="#F5F0E8" opacity="0.9"/>
  <!-- Stars -->
  <g fill="#F5F0E8" opacity="0.7">
    <circle cx="120" cy="90" r="2.2"/><circle cx="300" cy="60" r="1.6"/><circle cx="520" cy="110" r="1.8"/>
    <circle cx="700" cy="70" r="2.4"/><circle cx="820" cy="150" r="1.5"/><circle cx="200" cy="180" r="1.4"/>
    <circle cx="620" cy="200" r="1.6"/><circle cx="90" cy="280" r="1.8"/><circle cx="790" cy="260" r="1.7"/>
  </g>
  <!-- Austin skyline silhouette -->
  <g fill="url(#hill)">
    <rect x="0" y="520" width="900" height="180"/>
    <rect x="40" y="440" width="46" height="90"/>
    <rect x="100" y="470" width="34" height="60"/>
    <rect x="150" y="420" width="52" height="110"/>
    <rect x="220" y="455" width="30" height="80"/>
    <path d="M300 530v-60h20l6-40 6 40h20v60z"/>
    <!-- Capitol dome -->
    <g>
      <rect x="400" y="470" width="100" height="60"/>
      <path d="M405 470 h90 v-14 h-90 z"/>
      <path d="M425 456 a25 25 0 0 1 50 0 z"/>
      <rect x="447" y="408" width="6" height="26"/>
      <circle cx="450" cy="404" r="5"/>
    </g>
    <rect x="540" y="430" width="48" height="100"/>
    <rect x="610" y="465" width="34" height="70"/>
    <rect x="660" y="410" width="56" height="120"/>
    <rect x="740" y="450" width="40" height="80"/>
    <rect x="800" y="480" width="60" height="50"/>
  </g>
  <!-- Rising figure: raised fist ribbon motif -->
  <g transform="translate(450,610)">
    <path d="M-120 40 q120 -70 240 0" fill="none" stroke="#14B8A6" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M-120 60 q120 -70 240 0" fill="none" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
